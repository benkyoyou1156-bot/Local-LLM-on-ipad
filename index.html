<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ローカルLLM</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--sub:#6e6e73;--card:#f2f2f7;--me:#0a84ff;--line:#d1d1d6}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--sub:#98989d;--card:#1c1c1e;--line:#38383a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px}
button{background:var(--me);color:#fff;border:0;font-weight:600}
button:disabled{opacity:.4}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#status{font-size:13px;color:var(--sub);padding:6px 14px}
#bar{height:3px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:var(--me);transition:width .2s}
#dbg{font:11px/1.45 ui-monospace,Menlo,monospace;background:var(--card);max-height:30vh;overflow:auto;padding:6px 14px;white-space:pre-wrap;word-break:break-all}
#dbg .e{color:#ff453a}#dbg .w{color:#ff9f0a}#dbg .t{color:var(--sub)}
details{border-top:1px solid var(--line)}summary{padding:6px 14px;font-size:13px;color:var(--sub);cursor:pointer}
summary button{padding:2px 10px;font-size:12px;margin-left:8px}
[hidden]{display:none!important}
#hf{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(720px,100%);max-height:88dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.sh,.sr{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.sr input{flex:1;min-width:0;font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px}
#hflist,#hfdetail{overflow:auto;-webkit-overflow-scrolling:touch}
.it{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:6px 0;font-weight:500}
.it small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:var(--me);color:#fff;margin-left:6px}
.warn{color:#ff9f0a;font-size:13px;margin:6px 0}
#log{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.m{max-width:85%;margin:0 0 10px;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.u{background:var(--me);color:#fff;margin-left:auto}.a{background:var(--card)}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;height:44px}
</style>
</head>
<body>
<header>
  <select id="model"></select>
  <select id="dtype" hidden></select>
  <select id="ver"><option value="4.3.0">transformers.js 4.3.0</option><option value="3.7.0">transformers.js 3.7.0(旧)</option></select>
  <button id="load">モデルを読み込む</button>
  <label style="font-size:13px"><input type="checkbox" id="verbose"> 詳細ログ</label>
  <label style="font-size:13px"><input type="checkbox" id="lowmem"> 省メモリ</label>
  <button id="openHF" class="sec">🔍 Hugging Faceで探す</button>
  <button id="pickDir" class="sec">📁 ONNXフォルダ</button>
  <button id="pickFiles" class="sec">📄 ファイル選択</button>
  <input type="file" id="dirIn" webkitdirectory multiple hidden>
  <input type="file" id="fileIn" multiple hidden>
  <button id="clear" class="sec">クリア</button>
</header>
<div id="bar"><i></i></div>
<div id="status">未読み込み(初回のみ数百MBをダウンロードします。Wi-Fi推奨)</div>
<details open><summary>ログ <button id="cp" class="sec" type="button">コピー</button></summary><div id="dbg"></div></details>
<div id="log"></div>
<form id="f">
  <textarea id="inp" placeholder="メッセージを入力" disabled></textarea>
  <button id="send" disabled>送信</button>
</form>

<div id="hf" hidden>
 <div class="sheet">
  <div class="sh"><b>Hugging Faceからモデルを探す</b><button id="closeHF" class="sec" type="button">閉じる</button></div>
  <div class="sr"><input id="hfq" placeholder="モデル名で検索 / owner/name を入力" autocomplete="off" autocapitalize="off">
   <select id="hfsort"><option value="downloads">人気順</option><option value="trendingScore">急上昇</option><option value="createdAt">新着</option></select></div>
  <div id="hflist"></div>
  <div id="hfdetail" hidden></div>
 </div>
</div>
<script type="module">
const MODELS = [
  {id:"onnx-community/LFM2.5-350M-ONNX", dt:"q4f16", label:"LFM2.5 350M q4f16(v4推奨)"},
  {id:"onnx-community/LFM2.5-350M-ONNX", dt:"q4", label:"LFM2.5 350M q4"},
  {id:"onnx-community/LFM2-350M-ONNX", dt:"q4", label:"LFM2 350M q4"},
  {id:"onnx-community/LFM2-700M-ONNX", dt:"q4", label:"LFM2 700M q4(メモリ多め)"},
  {id:"onnx-community/SmolLM2-360M-Instruct", dt:"q4", label:"SmolLM2 360M(切り分け用)"},
  {id:"onnx-community/SmolLM2-135M-Instruct", dt:"q4", label:"SmolLM2 135M(最小)"},
];
const $ = s => document.querySelector(s);
const sel = $("#model");
MODELS.forEach((m, i) => sel.add(new Option(m.label, String(i))));
const SAVED = "hfModels";
function saveModels() { try { localStorage.setItem(SAVED, JSON.stringify(MODELS.filter(m => m.hf).slice(-8))); } catch {} }
function addModel(m) {
  const i = MODELS.findIndex(x => x.id === m.id && x.dt === m.dt && (x.mf || "") === (m.mf || ""));
  if (i >= 0) return i;
  MODELS.push(m); sel.add(new Option(m.label, String(MODELS.length - 1)));
  if (m.hf) saveModels(); return MODELS.length - 1;
}
try { JSON.parse(localStorage.getItem(SAVED) || "[]").forEach(addModel); } catch {}

// ---- Worker(推論をメインスレッドから分離) ----
const workerSrc = `
let pipeline, TextStreamer, env, stopper = null, loadedVer = null;
const L = (t, lv) => postMessage({type:"log", text:t, lv: lv || "i"});
const fmt = a => { try { return typeof a === "string" ? a : (a && a.message) || JSON.stringify(a); } catch { return String(a); } };
for (const k of ["log","warn","error"]) { const o = console[k].bind(console);
  console[k] = (...a) => { L(fmt(a[0]).slice(0,300) + (a.length > 1 ? " " + a.slice(1).map(fmt).join(" ").slice(0,300) : ""), k === "error" ? "e" : k === "warn" ? "w" : "i"); o(...a); }; }
self.addEventListener("error", e => L("workerエラー: " + e.message, "e"));
self.addEventListener("unhandledrejection", e => L("未処理エラー: " + fmt(e.reason), "e"));
const seen = {};
function logP(p) {
  if (!p.file) return;
  if (p.status === "initiate") L("取得開始 " + p.file);
  else if (p.status === "progress") { const b = Math.floor((p.progress || 0) / 25);
    if (seen[p.file] !== b) { seen[p.file] = b; L(p.file + " " + (p.loaded/1048576).toFixed(1) + "/" + (p.total/1048576).toFixed(1) + "MB"); } }
  else if (p.status === "done") L("取得完了 " + p.file);
}
let gen = null;
async function init(ver) {
  if (loadedVer === ver) return;
  if (loadedVer) throw new Error("別バージョンを読み込むにはページを再読み込みしてください");
  L("transformers.js " + ver + " を取得中…");
  const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@" + ver);
  pipeline = T.pipeline; TextStreamer = T.TextStreamer; env = T.env;
  env.allowLocalModels = false;
  stopper = T.InterruptableStoppingCriteria ? new T.InterruptableStoppingCriteria() : null;
  loadedVer = ver; L("transformers.js " + ver + " 読み込み完了");
}
const files = {};
const progress = p => {
  if (p.status === "progress") {
    files[p.file] = {l: p.loaded, t: p.total};
    let l = 0, t = 0; for (const k in files) { l += files[k].l; t += files[k].t; }
    postMessage({type:"progress", pct: t ? l / t * 100 : 0, mb: l / 1048576});
  }
};
function setupLocal(files) {
  const map = new Map(); for (const {path, file} of files) map.set(path, file);
  env.useCustomCache = true;
  env.customCache = {
    async match(key) {
      const u = decodeURIComponent(String(key.url || key));
      const rel = u.includes("/resolve/main/") ? u.split("/resolve/main/")[1] : u.split("/").pop();
      const base = rel.split("/").pop();
      let f = map.get(rel);
      if (!f) for (const [p, v] of map) if (p === base || p.endsWith("/" + rel)) { f = v; break; }
      return f ? new Response(f, {headers: {"content-length": String(f.size)}}) : undefined;
    },
    async put() {}
  };
}
async function load(model, device, dtype, mf, opt) {
  if (gen) { try { await gen.dispose(); } catch {} gen = null; }
  opt = opt || {};
  const so = {};
  if (opt.verbose) { env.backends.onnx.logLevel = "verbose"; so.logSeverityLevel = 0; so.logVerbosityLevel = 1; }
  if (opt.lowmem) { so.graphOptimizationLevel = "disabled"; so.enableCpuMemArena = false; so.enableMemPattern = false; }
  L("session_options=" + JSON.stringify(so));
  L("load model=" + model + " device=" + device + " dtype=" + dtype + (mf ? " file=" + mf : ""));
  postMessage({type:"stage", text:"ダウンロード/読み込み中(" + device + ")"});
  gen = await pipeline("text-generation", model, {device, session_options: so, dtype: mf ? "fp32" : dtype, ...(mf ? {model_file_name: mf} : {}), progress_callback: p => {
    progress(p); logP(p);
    if (p.status === "done") postMessage({type:"stage", text:"ファイル読み込み済み。モデルを初期化中…(1〜2分かかることがあります)"});
  }});
  L("パイプライン作成完了");
  postMessage({type:"stage", text:"初期化完了。ウォームアップ中…"});
  await gen([{role:"user",content:"hi"}], {max_new_tokens:1});
  L("ウォームアップ完了");
}
onmessage = async ({data}) => {
  try {
    if (data.type === "load") {
      await init(data.ver);
      let device = data.device, model = data.model;
      if (data.files) { setupLocal(data.files); model = "local/model"; }
      try { await load(model, device, data.dtype, data.mf, data.opt); }
      catch (e) {
        if (device !== "webgpu") throw e;
        device = "wasm"; postMessage({type:"fallback"});
        await load(model, device, data.dtype, data.mf, data.opt);
      }
      postMessage({type:"ready", device});
    } else if (data.type === "generate") {
      if (stopper) stopper.reset();
      try {
        const pr = gen.tokenizer.apply_chat_template(data.messages, {tokenize: false, add_generation_prompt: true});
        L("プロンプト: " + JSON.stringify(pr).slice(0, 400));
      } catch (e) { L("チャットテンプレート適用失敗: " + fmt(e), "e"); }
      const streamer = new TextStreamer(gen.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: t => postMessage({type:"token", text:t})
      });
      await gen(data.messages, {max_new_tokens: 512, do_sample: true, temperature: 0.3, top_k: 50,
        repetition_penalty: 1.05, streamer, ...(stopper ? {stopping_criteria: stopper} : {})});
      postMessage({type:"done"});
    } else if (data.type === "stop" && stopper) stopper.interrupt();
  } catch (e) { postMessage({type:"error", message: String(e && e.message || e)}); }
};`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], {type:"text/javascript"})), {type:"module"});

// ---- 環境判定 ----
let nTok = 0, tg = 0;
let hasGPU = false;
try { hasGPU = !!navigator.gpu && !!(await navigator.gpu.requestAdapter()); } catch {}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const dbg = $("#dbg"), t0 = performance.now();
function log(t, lv) {
  const d = document.createElement("div"); if (lv) d.className = lv;
  d.innerHTML = '<span class="t">' + ((performance.now() - t0) / 1000).toFixed(1).padStart(5) + 's</span> ';
  d.append(document.createTextNode(t)); dbg.append(d);
  while (dbg.childNodes.length > 800) dbg.firstChild.remove();
  dbg.scrollTop = 1e9;
}
$("#cp").onclick = e => { e.preventDefault(); navigator.clipboard?.writeText(dbg.innerText).then(() => log("ログをコピーしました"), () => log("コピー失敗", "w")); };
addEventListener("error", e => log("エラー: " + e.message, "e"));
addEventListener("unhandledrejection", e => log("未処理エラー: " + (e.reason && e.reason.message || e.reason), "e"));
const setStatus = t => $("#status").textContent = t;
log(`UA: ${navigator.userAgent.slice(0, 90)}`);
let f16 = "?"; try { f16 = (await navigator.gpu.requestAdapter()).features.has("shader-f16"); } catch {}
log(`WebGPU=${hasGPU} shader-f16=${f16} deviceMemory=${navigator.deviceMemory ?? "不明"} isolated=${self.crossOriginIsolated}`);
setStatus(`${isIOS ? "iPad/iPhone" : "PC/その他"} ・ ${hasGPU ? "WebGPU対応" : "WebGPU非対応(WASMで実行)"}`);

// ---- UI ----
const history = []; let cur = null, busy = false;
const add = (cls, text) => { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  $("#log").append(d); $("#log").scrollTop = 1e9; return d; };

// ---- ローカルONNX(フォルダ or 複数ファイル) ----
let localFiles = null;
const dsel = $("#dtype");
const DT = {quantized:"q8"}, OK = ["fp32","fp16","q8","int8","uint8","q4","q4f16","bnb4"];
$("#pickDir").onclick = () => $("#dirIn").click();
$("#pickFiles").onclick = () => $("#fileIn").click();
function onPick(e) {
  const fs = [...e.target.files]; if (!fs.length) return;
  localFiles = fs.map(f => {
    const rp = f.webkitRelativePath;
    return {path: rp ? rp.split("/").slice(1).join("/") : f.name, file: f};
  });
  const types = new Set();
  for (const {path} of localFiles) {
    const m = path.split("/").pop().match(/^model(?:_(.+))?\.onnx$/);
    if (m) { const t = DT[m[1]] || m[1] || "fp32"; types.add(t); }
  }
  const need = ["config.json", "tokenizer.json"].filter(n => !localFiles.some(x => x.path.split("/").pop() === n));
  if (!types.size) return setStatus("model*.onnx が見つかりません。onnxフォルダごと選んでください。");
  if (need.length) setStatus("注意: " + need.join(", ") + " が見つかりません(config/tokenizerも一緒に選んでください)");
  else setStatus(`ローカルONNX: ${localFiles.length}ファイルを認識`);
  const lab = `ローカル(${localFiles.length}ファイル)`;
  sel.querySelector("[value=__local__]")?.remove();
  sel.add(new Option(lab, "__local__")); sel.value = "__local__";
  dsel.innerHTML = ""; [...types].forEach(t => dsel.add(new Option(t, t)));
  dsel.value = types.has("q4") ? "q4" : [...types][0]; dsel.hidden = false;
  e.target.value = "";
}
$("#dirIn").onchange = $("#fileIn").onchange = onPick;
sel.onchange = () => { dsel.hidden = sel.value !== "__local__"; };

// ---- Hugging Faceブラウザ ----
const hf = $("#hf"), hq = $("#hfq"), hsort = $("#hfsort"), hl = $("#hflist"), hd = $("#hfdetail");
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
$("#openHF").onclick = () => { hf.hidden = false; hq.focus(); if (!hl.childElementCount) hfSearch(); };
$("#closeHF").onclick = () => hf.hidden = true;
let hT; hq.oninput = () => { clearTimeout(hT); hT = setTimeout(hfSearch, 450); };
hq.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); const v = hq.value.trim();
  if (/^[\w.-]+\/[\w.-]+$/.test(v)) hfDetail(v); else hfSearch(); } };
hsort.onchange = hfSearch;

async function hfSearch() {
  hd.hidden = true; hl.hidden = false; hl.textContent = "検索中…";
  const q = hq.value.trim();
  const url = "https://huggingface.co/api/models?" + (q ? "search=" + encodeURIComponent(q) + "&" : "") +
    "filter=onnx&pipeline_tag=text-generation&sort=" + hsort.value + "&direction=-1&limit=30";
  try {
    const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status);
    const a = await r.json(); hl.textContent = "";
    if (!a.length) { hl.textContent = "見つかりませんでした"; return; }
    for (const m of a) {
      const b = el("button", m.id, "it"); b.type = "button";
      if ((m.tags || []).includes("transformers.js")) b.append(el("span", "Transformers.js", "badge"));
      b.append(el("small", `↓${(m.downloads || 0).toLocaleString()}  ♥${m.likes || 0}`));
      b.onclick = () => hfDetail(m.id); hl.append(b);
    }
  } catch (e) { hl.textContent = "検索に失敗しました: " + e.message; log("HF検索失敗: " + e.message, "e"); }
}

async function hfDetail(id) {
  hl.hidden = true; hd.hidden = false; hd.textContent = "情報を取得中…";
  try {
    const r = await fetch("https://huggingface.co/api/models/" + id + "?blobs=true");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(), sizes = {}, names = new Set();
    for (const f of j.siblings || []) {
      names.add(f.rfilename.split("/").pop());
      const m = f.rfilename.match(/^onnx\/model(?:_([A-Za-z0-9]+))?\.onnx(?:_data(?:_\d+)?)?$/);
      if (m) { const t = DT[m[1]] || m[1] || "fp32"; sizes[t] = (sizes[t] || 0) + (f.size || (f.lfs && f.lfs.size) || 0); }
    }
    hd.textContent = "";
    hd.append(el("b", id), el("div", `↓${(j.downloads || 0).toLocaleString()}  ♥${j.likes || 0}`, "warn"));
    hd.lastChild.style.color = "var(--sub)";
    const types = Object.keys(sizes);
    if (!types.length) { hd.append(el("div", "このリポジトリにはブラウザ用のONNXファイル(onnx/model*.onnx)がありません。", "warn")); }
    const miss = ["config.json", "tokenizer.json"].filter(n => !names.has(n));
    if (miss.length) hd.append(el("div", "注意: " + miss.join(", ") + " が見つかりません。動かない可能性があります。", "warn"));
    const ds = document.createElement("select"); ds.style.margin = "8px 0"; ds.style.width = "100%";
    types.sort((a, b) => sizes[a] - sizes[b]).forEach(t => ds.add(new Option(`${t}  –  ${(sizes[t] / 1048576).toFixed(0)}MB`, t)));
    ds.value = types.includes("q4f16") && hasGPU && f16 === true ? "q4f16" : types.includes("q4") ? "q4" : types[0];
    const w = el("div", "", "warn");
    const upd = () => { const mb = sizes[ds.value] / 1048576;
      w.textContent = mb > 700 && isIOS ? `約${mb.toFixed(0)}MB: iPadではメモリ不足で落ちる可能性があります(目安は〜500MB)` : ""; };
    ds.onchange = upd; upd();
    const go = el("button", "このモデルを読み込む"); go.type = "button"; go.style.width = "100%"; go.disabled = !types.length;
    const back = el("button", "← 一覧に戻る", "sec"); back.type = "button"; back.style.cssText = "width:100%;margin-top:8px";
    back.onclick = () => { hd.hidden = true; hl.hidden = false; };
    go.onclick = () => {
      const t = ds.value, custom = !OK.includes(t);
      const i = addModel({id, dt: custom ? "fp32" : t, mf: custom ? "model_" + t : null, hf: true, label: `${id.split("/").pop()} ${t}`});
      sel.value = String(i); sel.onchange(); hf.hidden = true; $("#load").click();
    };
    hd.append(...(types.length ? [ds, w] : []), go, back);
  } catch (e) { hd.textContent = "取得に失敗しました: " + e.message; log("HF詳細取得失敗: " + e.message, "e"); }
}

let loading = false, hb = null, lastMsg = performance.now();
$("#load").onclick = () => {
  if (loading) { log("すでに読み込み中です(無視)", "w"); return; }
  loading = true; lastMsg = performance.now(); $("#inp").disabled = $("#send").disabled = true;
  const ts = performance.now(); clearInterval(hb);
  hb = setInterval(() => log(`…経過 ${((performance.now() - ts) / 1000) | 0}秒(Worker最終応答 ${((performance.now() - lastMsg) / 1000) | 0}秒前)`, "t"), 5000);
  log("読み込み開始: " + sel.options[sel.selectedIndex].text + (sel.value === "__local__" ? " dtype=" + dsel.value : ""));
  $("#load").disabled = sel.disabled = dsel.disabled = true;
  setStatus("読み込み中…(大きいモデルは時間がかかります)");
  const local = sel.value === "__local__";
  const M = local ? null : MODELS[+sel.value];
  let dtype = local ? dsel.value : M.dt, mf = local ? null : (M.mf || null);
  if (local && !OK.includes(dtype)) { mf = "model_" + dtype; }
  worker.postMessage({type:"load", ver: $("#ver").value, model: local ? "local" : M.id, device: hasGPU ? "webgpu" : "wasm", dtype, mf, files: local ? localFiles : null, opt: {verbose: $("#verbose").checked, lowmem: $("#lowmem").checked}});
};
$("#clear").onclick = () => { history.length = 0; $("#log").innerHTML = ""; };

worker.onmessage = ({data:d}) => {
  lastMsg = performance.now();
  if (d.type === "log") { log(d.text, d.lv === "e" ? "e" : d.lv === "w" ? "w" : ""); return; }
  if (d.type === "progress") { $("#bar i").style.width = d.pct + "%"; setStatus(d.pct >= 99.5 ? "ダウンロード完了。初期化中…(1〜2分かかることがあります)" : `ダウンロード中 ${d.mb.toFixed(0)}MB(${d.pct.toFixed(0)}%)`); }
  else if (d.type === "stage") { setStatus(d.text); log(d.text); }
  else if (d.type === "fallback") log("WebGPU失敗 → WASMへ切替", "w"), setStatus("WebGPUで失敗したためCPU(WASM)に切り替えます…");
  else if (d.type === "ready") {
    clearInterval(hb); loading = false; log("準備完了 device=" + d.device);
    $("#bar i").style.width = "100%";
    setStatus(`準備完了(${d.device === "webgpu" ? "WebGPU" : "WASM/CPU"})`);
    $("#inp").disabled = $("#send").disabled = false; $("#inp").focus();
    $("#load").disabled = sel.disabled = dsel.disabled = false;
  }
  else if (d.type === "token") { if (!nTok++) log("最初のトークン " + (((performance.now() - tg) / 1000).toFixed(1)) + "秒"); cur.textContent += d.text; $("#log").scrollTop = 1e9; }
  else if (d.type === "done") { log(`生成完了 ${nTok}チャンク ${(((performance.now() - tg) / 1000)).toFixed(1)}秒`); history.push({role:"assistant", content: cur.textContent}); finish(); }
  else if (d.type === "error") {
    clearInterval(hb); loading = false; log("エラー: " + d.message, "e");
    if (/^\d+$/.test(d.message)) log("→ ONNX Runtime内部エラー(未対応オペレーターやモデル形式の不一致の可能性)。別のモデル/精度を試してください", "w");
    setStatus("エラー: " + d.message + "(メモリ不足の場合は小さいモデルを選び、ページを再読み込みしてください)");
    $("#load").disabled = sel.disabled = dsel.disabled = false; if (busy) finish();
  }
};
worker.onerror = e => { clearInterval(hb); loading = false; log("Workerエラー: " + (e.message || "(詳細なし)"), "e"); setStatus("Workerエラー: " + (e.message || "読み込み失敗(メモリ不足/ライブラリ取得失敗の可能性)")); $("#load").disabled = sel.disabled = dsel.disabled = false; };
worker.onmessageerror = () => setStatus("Worker通信エラー");
function finish() { busy = false; $("#send").textContent = "送信"; }

$("#f").onsubmit = e => {
  e.preventDefault();
  if (busy) { worker.postMessage({type:"stop"}); return; }
  const t = $("#inp").value.trim(); if (!t) return;
  $("#inp").value = ""; add("u", t); history.push({role:"user", content:t});
  cur = add("a", ""); busy = true; nTok = 0; tg = performance.now(); log("生成開始"); $("#send").textContent = "停止";
  const sys = {role:"system", content:"あなたは親切な日本語アシスタントです。簡潔に答えてください。"};
  worker.postMessage({type:"generate", messages:[sys, ...history.slice(-8)]});
};
</script>
