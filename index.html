<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--bg:#faf9f5;--fg:#29261b;--sub:#6b6a65;--card:#f0eee6;--line:#e3e0d3;--ac:#c96442;--inp:#fff;--ok:#5a9a5a}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#faf9f5;--sub:#a3a29a;--card:#30302e;--line:#3d3d3a;--ac:#d97757;--inp:#30302e}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.65 Georgia,"Hiragino Sans",-apple-system,sans-serif;position:fixed;top:0;left:0;right:0;height:var(--h,100dvh);overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,select,textarea,input{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.4}
select,textarea,input[type=text],input:not([type]){width:100%;border:1px solid var(--line);border-radius:10px;background:var(--inp);padding:8px 12px}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
#chip{max-width:60%;font:13px -apple-system,"Hiragino Sans",sans-serif;color:var(--sub);background:var(--card);border-radius:20px;padding:5px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#chip::before{content:"●";color:var(--sub);margin-right:6px;font-size:10px}#chip.on::before{color:var(--ok)}
.ib{padding:6px 10px;font-size:20px;background:none;color:var(--sub);border:0}
#setup{flex:1;overflow:auto;padding:28px 18px;max-width:620px;width:100%;margin:0 auto}
.hero{text-align:center;margin-bottom:22px}.lg{font-size:52px;color:var(--ac);line-height:1.1}.hero h1{font-size:28px;font-weight:400;margin:8px 0}.hero p{color:var(--sub);margin:6px 0;font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:15px}
.card{display:block;width:100%;text-align:left;background:var(--inp);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:10px 0;font-weight:400}
.card.rec{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.card b{font-size:17px;font-weight:500}.card small{display:block;color:var(--sub);font-size:13px;font-family:-apple-system,"Hiragino Sans",sans-serif}
.tag{font:11px -apple-system,sans-serif;background:var(--ac);color:#fff;border-radius:8px;padding:1px 8px;margin-left:8px}
.bar{height:6px;background:var(--card);border-radius:6px;overflow:hidden;margin:14px 0 10px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
#ptxt{text-align:center;white-space:pre-line}
.note{font:13px -apple-system,"Hiragino Sans",sans-serif;color:var(--sub);text-align:center}.err{color:#d6453a;font-size:14px;margin:10px 0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:760px;margin:0 auto}
#log{flex:1;overflow-y:auto;padding:8px 16px;-webkit-overflow-scrolling:touch}
.m{margin:0 0 18px;word-break:break-word;white-space:pre-wrap}
.u{max-width:82%;margin-left:auto;background:var(--card);padding:9px 16px;border-radius:18px}
.a{padding:0 2px}.a.typing:empty::before{content:"✻";color:var(--ac);font-size:20px;display:inline-block;animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cp{display:block;font:12px -apple-system,sans-serif;color:var(--sub);margin-top:4px;cursor:pointer}
#hint{text-align:center;margin-top:9vh}#hint h2{font-size:30px;font-weight:400;margin:6px 0}#hint p{color:var(--sub);margin:0 0 14px;font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:15px}
.chipb{display:inline-block;margin:4px;padding:8px 16px;border-radius:20px;background:none;color:var(--fg);border:1px solid var(--line);font:500 14px -apple-system,"Hiragino Sans",sans-serif}
form{padding:6px 14px 12px}
.box{display:flex;flex-direction:column;gap:4px;background:var(--inp);border:1px solid var(--line);border-radius:22px;padding:12px 10px 8px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.l{display:flex;align-items:center;min-width:0;max-width:76%}
#lamp{width:8px;height:8px;box-sizing:content-box;padding:6px;background:var(--line);background-clip:content-box;border-radius:50%;flex:none;cursor:pointer;transition:background .4s,box-shadow .4s}
#lamp.on{background:var(--ok);background-clip:content-box;box-shadow:0 0 6px var(--ok)}
#lamp.ld{background:#e0a030;background-clip:content-box;animation:bl 1s ease-in-out infinite}
@keyframes bl{50%{opacity:.35}}
.it.cur{border-color:var(--ac)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px}
#msel{width:auto;min-width:0;max-width:100%;border:0;background:none;color:var(--sub);padding:4px 0;font:16px -apple-system,"Hiragino Sans",sans-serif}
#pb{margin:0 16px 8px;padding:12px 16px;background:var(--card);border-radius:16px;font:14px -apple-system,"Hiragino Sans",sans-serif}#pb .bar{margin:8px 0}#perr{margin:0 16px 8px}
#inp{resize:none;height:30px;max-height:150px;border:0;background:none;padding:6px 0;outline:none;font-family:-apple-system,"Hiragino Sans",sans-serif}
#send{border-radius:50%;width:36px;height:36px;padding:0;font-size:17px;flex:none}
#sheet{position:fixed;top:0;left:0;right:0;height:var(--h,100dvh);background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--bg);width:min(720px,100%);max-height:calc(var(--h,100dvh)*.92);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph b{font-size:20px;font-weight:500}
.body{overflow:auto;-webkit-overflow-scrolling:touch;font-family:-apple-system,"Hiragino Sans",sans-serif}
.body h3{font-size:13px;color:var(--sub);margin:20px 0 6px;font-weight:600}
.body label{display:flex;justify-content:space-between;font-size:14px;margin:12px 0 4px}.body label output{color:var(--sub)}
.body input[type=range]{width:100%;accent-color:var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row button{flex:1}
.hint{font-size:12px;color:var(--sub);margin:2px 0}
#dbg{font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--card);padding:8px;border-radius:10px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#dbg .e{color:#d6453a}#dbg .w{color:#c98a1a}
.it{display:block;width:100%;text-align:left;background:var(--inp);color:var(--fg);border:1px solid var(--line);margin:6px 0;font-weight:500;word-break:break-all}.it small{display:block;color:var(--sub);font-weight:400;font-size:12px}
#inp,#hfq,#msel,.pane textarea,.pane select{font-size:16px!important}
.warn{color:#c98a1a;font-size:13px;margin:6px 0}

 </div>

<script type="text/plain" id="wk">
let pipeline,TextStreamer,env,stopper=null,ver=null,gen=null;
const L=(t,lv)=>postMessage({type:"log",text:t,lv:lv||"i"});
const fmt=a=>{try{return typeof a==="string"?a:(a&&a.message)||JSON.stringify(a)}catch{return String(a)}};
for(const k of["log","warn","error"]){const o=console[k].bind(console);console[k]=(...a)=>{L(a.map(fmt).join(" ").slice(0,300),k==="error"?"e":k==="warn"?"w":"i");o(...a)}}
self.addEventListener("unhandledrejection",e=>L("未処理エラー: "+fmt(e.reason),"e"));
const files={};
const pend=new Set();
const prog=p=>{
  if(p.status==="initiate"){pend.add(p.file);L("取得開始 "+p.file)}
  else if(p.status==="done"){pend.delete(p.file);L("取得完了 "+p.file)}
  else if(p.status==="progress"){files[p.file]={l:p.loaded,t:p.total}}
  else return;
  let l=0,t=0;for(const k in files){l+=files[k].l;t+=files[k].t}
  postMessage({type:"progress",pct:t?l/t*100:0,mb:l/1048576,tot:t/1048576,pend:pend.size});
};
async function init(v){
  if(ver===v)return; if(ver)throw new Error("別バージョンを使うにはページを再読み込みしてください");
  L("transformers.js "+v+" を取得中…");
  const T=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@"+v);
  pipeline=T.pipeline;TextStreamer=T.TextStreamer;env=T.env;env.allowLocalModels=false;
  stopper=T.InterruptableStoppingCriteria?new T.InterruptableStoppingCriteria():null;ver=v;L("transformers.js "+v+" 読み込み完了");
}
function local(fs){
  const map=new Map();for(const{path,file}of fs)map.set(path,file);
  env.useCustomCache=true;
  env.customCache={async match(key){
    const u=decodeURIComponent(String(key.url||key));
    const rel=u.includes("/resolve/main/")?u.split("/resolve/main/")[1]:u.split("/").pop();const base=rel.split("/").pop();
    let f=map.get(rel);if(!f)for(const[p,v]of map)if(p===base||p.endsWith("/"+rel)){f=v;break}
    return f?new Response(f,{headers:{"content-length":String(f.size)}}):undefined},async put(){}};
}
async function load(model,device,dtype,mf,opt){
  for(const k in files)delete files[k];pend.clear();
  if(gen){try{await gen.dispose()}catch{}gen=null}
  const so={};
  if(opt.verbose){env.backends.onnx.logLevel="verbose";so.logSeverityLevel=0;so.logVerbosityLevel=1}
  if(opt.lowmem){so.graphOptimizationLevel="disabled";so.enableCpuMemArena=false;so.enableMemPattern=false}
  L("load "+model+" device="+device+" dtype="+dtype+(mf?" file="+mf:""));
  gen=await pipeline("text-generation",model,{device,session_options:so,dtype:mf?"fp32":dtype,...(mf?{model_file_name:mf}:{}),progress_callback:prog});
  postMessage({type:"stage",text:"最終準備中…"});
  await gen([{role:"user",content:"hi"}],{max_new_tokens:1});
}
onmessage=async({data:d})=>{
  try{
    if(d.type==="load"){
      await init(d.ver);let device=d.device,model=d.model;
      if(d.files){local(d.files);model="local/model"}
      try{await load(model,device,d.dtype,d.mf,d.opt)}
      catch(e){if(device!=="webgpu")throw e;L("WebGPU失敗→CPUに切替: "+fmt(e),"w");device="wasm";postMessage({type:"fallback"});await load(model,device,d.dtype,d.mf,d.opt)}
      postMessage({type:"ready",device});
    }else if(d.type==="generate"){
      if(stopper)stopper.reset();
      const streamer=new TextStreamer(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:"token",text:t})});
      const g=d.g;
      await gen(d.messages,{max_new_tokens:g.max,do_sample:g.temp>0,temperature:g.temp||undefined,top_k:g.topk,repetition_penalty:g.rp,streamer,...(stopper?{stopping_criteria:stopper}:{})});
      postMessage({type:"done"});
    }else if(d.type==="unload"){if(gen){try{await gen.dispose()}catch{}gen=null}postMessage({type:"unloaded"})}
    else if(d.type==="stop"&&stopper)stopper.interrupt();
  }catch(e){postMessage({type:"error",message:String(e&&e.message||e)})}
};
</script>

<script type="module">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// 画面の高さを実測して反映(回転・ツールバー・キーボード対策)
const vv=window.visualViewport;
function fit(){
  const h=vv?vv.height:innerHeight;
  document.documentElement.style.setProperty("--h",h+"px");
  document.body.style.top=(vv?vv.offsetTop:0)+"px";
  if(!vv||vv.offsetTop===0)scrollTo(0,0);
}
if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
addEventListener("resize",fit);
addEventListener("orientationchange",()=>{fit();setTimeout(fit,150);setTimeout(fit,500)});
fit();
const DEF={sys:"あなたは親切な日本語アシスタントです。簡潔に答えてください。",temp:0.3,maxTok:512,mem:10,rp:1.05,topk:50,fs:16,ver:"4.3.0",low:false,verbose:false,auto:true,model:null};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem("llm_s")||"{}"))}catch{}
const save=()=>{try{localStorage.setItem("llm_s",JSON.stringify(S))}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let C={list:[],cur:null};try{C=JSON.parse(localStorage.getItem("llm_c")||"null")||C}catch{}
if(!C.list.length){let old=[];try{old=JSON.parse(localStorage.getItem("llm_h")||"[]")}catch{}
  if(old.length){const id=uid();C={list:[{id,title:(old.find(m=>m.role==="user")||{content:"会話"}).content.slice(0,30),t:Date.now(),msgs:old}],cur:id}}}
function saveC(){for(let i=0;i<5;i++){try{localStorage.setItem("llm_c",JSON.stringify(C));return}catch{C.list.sort((a,b)=>b.t-a.t);C.list.pop()}}}
let H=[];{const c=C.list.find(x=>x.id===C.cur);if(c)H=c.msgs.slice()}
function saveH(){
  if(!H.length)return;
  let c=C.list.find(x=>x.id===C.cur);
  if(!c){c={id:uid(),title:"",t:0,msgs:[]};C.list.unshift(c);C.cur=c.id}
  c.msgs=H.slice(-200);c.t=Date.now();
  if(!c.title)c.title=(H.find(m=>m.role==="user")||{content:"新しい会話"}).content.slice(0,30);
  C.list.sort((a,b)=>b.t-a.t);C.list=C.list.slice(0,50);saveC();
}

// ---- ログ ----
const dbg=$("#dbg"),t0=performance.now();
function log(t,lv){const d=document.createElement("div");if(lv)d.className=lv;d.textContent=((performance.now()-t0)/1000).toFixed(1)+"s "+t;dbg.append(d);while(dbg.childNodes.length>600)dbg.firstChild.remove();dbg.scrollTop=1e9}
addEventListener("error",e=>log("エラー: "+e.message,"e"));
addEventListener("unhandledrejection",e=>log("未処理: "+(e.reason&&e.reason.message||e.reason),"e"));
$("#cpl").onclick=()=>navigator.clipboard?.writeText(dbg.innerText).then(()=>log("コピーしました"),()=>{});

// ---- 環境 ----
let hasGPU=false,f16=false;
try{const a=await navigator.gpu.requestAdapter();hasGPU=!!a;f16=!!a&&a.features.has("shader-f16")}catch{}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
log(`UA=${navigator.userAgent.slice(0,80)} WebGPU=${hasGPU} f16=${f16}`);

// ---- モデル候補 ----
const P=[
 {id:"onnx-community/LFM2.5-350M-ONNX",dt:f16&&hasGPU?"q4f16":"q4",name:"かんたん",desc:"軽くて速い。まずはこれ(約300MB)",rec:1},
 {id:"onnx-community/LFM2-700M-ONNX",dt:"q4",name:"ふつう",desc:"賢さと速さのバランス(約500MB)"},
 {id:"onnx-community/LFM2-1.2B-ONNX",dt:"q4",name:"高品質",desc:"より賢い。新しめのiPad・PC向け(約700MB)"},
];
const mkey=m=>m?m.id+"|"+m.dt+"|"+(m.mf||""):"";
let ML=[],loadedKey="",loadedName="",dev="",pendingText=null;
function buildSel(){
  const ms=$("#msel"),c=S.model||P[0],ck=mkey(c);ms.textContent="";
  ML=[...P,...(S.custom||[])];let i=ML.findIndex(m=>mkey(m)===ck);
  ML.forEach((m,j)=>ms.add(new Option(m.name+(P.includes(m)?"モデル":""),String(j))));
  if(i<0){ms.add(new Option(c.name,"cur"));i="cur"}
  const sp=new Option("──────","x");sp.disabled=true;ms.add(sp);
  ms.add(new Option("＋ 他のモデルを探す…","srch"));ms.add(new Option("＋ ファイルから読み込む…","file"));
  ms.value=String(i);
}
function updChip(){
  const c=S.model||P[0],ch=$("#chip");
  if(loading){ch.textContent=c.name+" ・読み込み中";ch.className=""}
  else if(ready&&mkey(c)===loadedKey){ch.textContent=c.name+(dev==="webgpu"?" ・高速":" ・標準");ch.className="on"}
  else{ch.textContent=c.name+" ・未読み込み";ch.className=""}
  const lp=$("#lamp");
  lp.className=loading?"ld":ready?"on":"";
  lp.title=loading?"モデルを読み込み中":ready?"モデルがメモリに載っています: "+loadedName+"(タップで解放)":"モデルはメモリに載っていません";
  buildSel();
}
function addCustom(){S.custom=[S.model,...(S.custom||[]).filter(x=>mkey(x)!==mkey(S.model))].slice(0,5);save()}
$("#lamp").onclick=()=>{
  if(loading||busy||!ready)return;
  if(confirm("モデルをメモリから解放しますか?\n次にメッセージを送ると、自動で読み込み直します。"))W.postMessage({type:"unload"})};
$("#msel").onchange=e=>{
  const v=e.target.value;
  if(v==="srch"){buildSel();$("#openHF").click();return}
  if(v==="file"){buildSel();$("#dirIn").click();return}
  if(v==="cur"||busy||loading){buildSel();return}
  const m=ML[+v];S.model={id:m.id,dt:m.dt,mf:m.mf||null,name:m.name||m.id.split("/").pop()};save();updChip();
};

// ---- ワーカー ----
let W;const wkSrc=$("#wk").textContent;
function mk(){W=new Worker(URL.createObjectURL(new Blob([wkSrc],{type:"text/javascript"})),{type:"module"});W.onmessage=onMsg;W.onerror=onErr}
let loading=false,ready=false,busy=false,cur=null,hb=null,last=performance.now(),pg=null,stage=false,initStart=0;
const flag=(on)=>{try{on?localStorage.setItem("llm_ld",Date.now()):localStorage.removeItem("llm_ld")}catch{}};
function updProg(){
  if(!loading)return;
  if(pg&&(pg.pend>0||pg.pct<99.5)){bar(pg.pct);initStart=0;$("#ptxt").textContent=`ダウンロード中 ${pg.pct.toFixed(0)}%(${pg.mb.toFixed(0)} / ${pg.tot.toFixed(0)}MB)`}
  else if(pg||stage){if(!initStart)initStart=performance.now();bar(100);const t=((performance.now()-initStart)/1000)|0;
    $("#ptxt").textContent="モデルを準備しています… "+t+"秒"+(t>90?"\n時間がかかっています。キャンセルして軽いモデルをお試しください。":"")}
}
const show=()=>{};
const bar=p=>$(".bar i").style.width=p+"%";
const modelName=()=>S.model?S.model.name:"未読み込み";
function loadModel(m){
  if(loading)return;loading=true;ready=false;
  S.model={id:m.id,dt:m.dt,mf:m.mf||null,name:m.name||m.id.split("/").pop()};if(!m.files)save();if(!m.files&&!P.some(x=>mkey(x)===mkey(S.model)))addCustom();
  updChip();$("#pb").hidden=false;$("#perr").hidden=true;bar(2);$("#ptxt").textContent="準備中…";
  pg=null;stage=false;initStart=0;flag(true);
  last=performance.now();const ts=last;clearInterval(hb);let n=0;
  hb=setInterval(()=>{updProg();if(++n%5===0)log(`…経過${((performance.now()-ts)/1000)|0}秒`)},1000);
  log("読み込み開始: "+S.model.name+" ("+m.id+" "+m.dt+")");
  W.postMessage({type:"load",ver:S.ver,model:m.files?"local":m.id,device:hasGPU?"webgpu":"wasm",dtype:m.dt,mf:m.mf||null,files:m.files||null,opt:{verbose:S.verbose,lowmem:S.low}});
}
function onMsg({data:d}){
  last=performance.now();
  if(d.type==="log"){log(d.text,d.lv==="e"?"e":d.lv==="w"?"w":"")}
  else if(d.type==="progress"){pg=d;updProg()}
  else if(d.type==="stage"){stage=true;updProg()}
  else if(d.type==="fallback"){pg=null;stage=false;initStart=0;$("#ptxt").textContent="標準モードに切り替えています…"}
  else if(d.type==="ready"){clearInterval(hb);flag(false);loading=false;ready=true;log("準備完了 "+d.device);
    loadedKey=mkey(S.model);loadedName=S.model.name;dev=d.device;updChip();$("#pb").hidden=true;renderChat();
    if(pendingText){const t=pendingText;pendingText=null;send(t)}else $("#inp").focus()}
  else if(d.type==="unloaded"){ready=false;loadedKey="";updChip();log("メモリから解放しました")}
  else if(d.type==="token"){cur.textContent+=d.text;$("#log").scrollTop=1e9}
  else if(d.type==="done"){H.push({role:"assistant",content:cur.textContent});saveH();endGen()}
  else if(d.type==="error"){clearInterval(hb);flag(false);log("エラー: "+d.message,"e");
    if(busy){cur.textContent+=(cur.textContent?"\n":"")+"(エラーが発生しました)";endGen();return}
    loading=false;pendingText=null;$("#pb").hidden=true;
    const pe=$("#perr");pe.hidden=false;pe.textContent="読み込めませんでした。メモリ不足の可能性があります。もっと軽いモデルをお試しください。(詳細: "+d.message+")";
    updChip()}
};
function onErr(e){clearInterval(hb);flag(false);loading=false;log("Workerエラー: "+(e.message||"不明"),"e");$("#perr").hidden=false;$("#perr").textContent="エラーが発生しました。ページを再読み込みしてください。";$("#pb").hidden=true;pendingText=null;updChip()};
mk();

// ---- チャット ----
function addMsg(cls,text){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;$("#log").append(d);$("#log").scrollTop=1e9;return d}
function addCopy(d){const c=document.createElement("span");c.className="cp";c.textContent="コピー";c.onclick=()=>navigator.clipboard?.writeText(d.firstChild.textContent).then(()=>{c.textContent="コピーしました"});d.append(c)}
function renderChat(){
  const l=$("#log");l.textContent="";
  if(!H.length){l.innerHTML='<div id="hint"><div class="lg">✻</div><h2>こんにちは</h2><p>今日はどんなお手伝いをしましょうか?</p></div>';
    for(const q of["今日の夕飯の献立を考えて","面白い雑学を教えて","メールの返信を丁寧にして"]){const c=document.createElement("button");c.className="chipb";c.textContent=q;c.onclick=()=>send(q);$("#hint").append(c)}return}
  for(const m of H){const d=addMsg(m.role==="user"?"u":"a",m.content);if(m.role!=="user")addCopy(d)}
}
function endGen(){busy=false;cur.classList.remove("typing");if(cur.textContent)addCopy(cur);$("#send").textContent="↑"}
function send(t){
  t=t.trim();if(!t||busy||loading)return;
  const cfg=S.model||P[0];
  if(!ready||mkey(cfg)!==loadedKey){pendingText=t;$("#inp").value="";$("#inp").style.height="30px";loadModel(cfg);return}
  if(!H.length)$("#log").textContent="";
  $("#inp").value="";$("#inp").style.height="30px";
  H.push({role:"user",content:t});addMsg("u",t);cur=addMsg("a","");cur.classList.add("typing");busy=true;$("#send").textContent="■";
  W.postMessage({type:"generate",messages:[{role:"system",content:S.sys},...H.slice(-S.mem)],g:{temp:S.temp,max:S.maxTok,topk:S.topk,rp:S.rp}});
}
$("#cancel").onclick=()=>{W.terminate();mk();clearInterval(hb);flag(false);loading=false;ready=false;
  $("#pb").hidden=true;pendingText=null;updChip();log("キャンセルしました","w")};
$("#f").onsubmit=e=>{e.preventDefault();if(busy)W.postMessage({type:"stop"});else send($("#inp").value)};
$("#inp").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$("#f").requestSubmit()}};
$("#inp").oninput=e=>{e.target.style.height="30px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"};
$("#newc").onclick=()=>{if(busy)return;H=[];C.cur=null;saveC();renderChat()};
$("#newc2").onclick=()=>$("#newc").click()||closeSheet();

// ---- 設定シート ----
const pane=id=>{$("#sheet").hidden=false;$$(".pane").forEach(p=>p.hidden=p.id!==id)};
const closeSheet=()=>$("#sheet").hidden=true;
$$(".close").forEach(b=>b.onclick=closeSheet);
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
async function stor(){try{const e=await navigator.storage.estimate();$("#stor").textContent="この端末に保存中のデータ: 約"+((e.usage||0)/1048576).toFixed(0)+"MB"}catch{$("#stor").textContent=""}}
function openSet(){$("#curm").textContent="現在のモデル: "+modelName();pane("p-set");stor()}
$("#gear").onclick=openSet;$("#chip").onclick=openSet;
$("#chg").onclick=()=>{closeSheet();$("#msel").focus()};
const applyFs=()=>document.body.style.fontSize=S.fs+"px";
$$("[data-k]").forEach(el=>{
  const k=el.dataset.k,cb=el.type==="checkbox",o=$(`[data-o=${k}]`);
  const put=()=>{if(cb)el.checked=!!S[k];else el.value=S[k];if(o)o.textContent=S[k]};put();
  el.oninput=el.onchange=()=>{S[k]=cb?el.checked:(el.type==="range"?+el.value:el.value);if(o)o.textContent=S[k];save();applyFs()};
});
applyFs();
$("#delc").onclick=async()=>{if(!confirm("ダウンロード済みのモデルをすべて削除します。次回は再ダウンロードが必要です。"))return;try{for(const k of await caches.keys())await caches.delete(k)}catch{}stor()};
$("#delh").onclick=()=>{if(!confirm("保存した会話をすべて削除します。"))return;H=[];C={list:[],cur:null};saveC();renderChat()};
$("#rst").onclick=()=>{if(!confirm("設定を初期化します。"))return;try{localStorage.removeItem("llm_s")}catch{}location.reload()};

// ---- 会話履歴 ----
function renderHist(){
  const l=$("#hl");l.textContent="";
  const ls=[...C.list].sort((a,b)=>b.t-a.t);
  if(!ls.length){const p=document.createElement("p");p.className="hint";p.textContent="まだ会話がありません";l.append(p)}
  for(const c of ls){
    const row=document.createElement("div");row.style.cssText="display:flex;gap:6px;align-items:stretch";
    const b=document.createElement("button");b.className="it"+(c.id===C.cur?" cur":"");b.style.flex="1";b.textContent=c.title||"新しい会話";
    const sm=document.createElement("small");sm.textContent=new Date(c.t).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+" ・"+c.msgs.length+"件";b.append(sm);
    b.onclick=()=>{if(busy)return;C.cur=c.id;H=c.msgs.slice();saveC();renderChat();closeSheet()};
    const d=document.createElement("button");d.className="sec";d.textContent="🗑";d.style.margin="6px 0";
    d.onclick=()=>{if(busy||!confirm("この会話を削除しますか?"))return;C.list=C.list.filter(x=>x.id!==c.id);if(C.cur===c.id){C.cur=null;H=[];renderChat()}saveC();renderHist()};
    row.append(b,d);l.append(row);
  }
}
$("#hist").onclick=()=>{renderHist();pane("p-hist")};

// ---- ローカルファイル ----
const DT={quantized:"q8"};
$("#pickDir").onclick=()=>$("#dirIn").click();$("#pickFiles").onclick=()=>$("#fileIn").click();
function onPick(e){
  const fs=[...e.target.files];if(!fs.length)return;
  const L2=fs.map(f=>({path:f.webkitRelativePath?f.webkitRelativePath.split("/").slice(1).join("/"):f.name,file:f}));
  const types=new Set();
  for(const{path}of L2){const m=path.split("/").pop().match(/^model(?:_(.+))?\.onnx$/);if(m)types.add(DT[m[1]]||m[1]||"fp32")}
  if(!types.size){alert("model*.onnx が見つかりません。onnxフォルダごと選んでください。");return}
  const t=f16&&types.has("q4f16")?"q4f16":types.has("q4")?"q4":[...types][0];
  const known=["fp32","fp16","q8","int8","uint8","q4","q4f16","bnb4"].includes(t);
  closeSheet();loadModel({id:"local",files:L2,dt:known?t:"fp32",mf:known?null:"model_"+t,name:"ローカルモデル("+t+")"});e.target.value="";
}
$("#dirIn").onchange=$("#fileIn").onchange=onPick;

// ---- Hugging Faceブラウザ ----
const hq=$("#hfq"),hl=$("#hfl"),hd=$("#hfd");
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
$("#openHF").onclick=()=>{pane("p-hf");hq.focus();if(!hl.childElementCount)hfSearch()};
let hT;hq.oninput=()=>{clearTimeout(hT);hT=setTimeout(hfSearch,450)};
hq.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=hq.value.trim();/^[\w.-]+\/[\w.-]+$/.test(v)?hfDetail(v):hfSearch()}};
$("#hfs").onchange=hfSearch;
async function hfSearch(){
  hd.hidden=true;hl.hidden=false;hl.textContent="検索中…";const q=hq.value.trim();
  try{
    const r=await fetch("https://huggingface.co/api/models?"+(q?"search="+encodeURIComponent(q)+"&":"")+"filter=onnx&pipeline_tag=text-generation&sort="+$("#hfs").value+"&direction=-1&limit=30");
    if(!r.ok)throw new Error("HTTP "+r.status);const a=await r.json();hl.textContent="";
    if(!a.length){hl.textContent="見つかりませんでした";return}
    for(const m of a){const b=el("button",m.id,"it");if((m.tags||[]).includes("transformers.js")){const t=el("span","対応",null);t.className="tag";b.append(t)}
      b.append(el("small","↓"+(m.downloads||0).toLocaleString()+"  ♥"+(m.likes||0)));b.onclick=()=>hfDetail(m.id);hl.append(b)}
  }catch(e){hl.textContent="検索に失敗しました: "+e.message}
}
async function hfDetail(id){
  hl.hidden=true;hd.hidden=false;hd.textContent="情報を取得中…";
  try{
    const r=await fetch("https://huggingface.co/api/models/"+id+"?blobs=true");if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json(),sizes={},names=new Set();
    for(const f of j.siblings||[]){names.add(f.rfilename.split("/").pop());
      const m=f.rfilename.match(/^onnx\/model(?:_([A-Za-z0-9]+))?\.onnx(?:_data(?:_\d+)?)?$/);
      if(m){const t=DT[m[1]]||m[1]||"fp32";sizes[t]=(sizes[t]||0)+(f.size||(f.lfs&&f.lfs.size)||0)}}
    hd.textContent="";hd.append(el("b",id));
    const types=Object.keys(sizes).sort((a,b)=>sizes[a]-sizes[b]);
    if(!types.length)hd.append(el("div","ブラウザ用のONNXファイルが見つかりません。","warn"));
    const miss=["config.json","tokenizer.json"].filter(n=>!names.has(n));
    if(miss.length)hd.append(el("div","注意: "+miss.join(", ")+" がないため動かない可能性があります。","warn"));
    const ds=document.createElement("select");ds.style.margin="8px 0";
    types.forEach(t=>ds.add(new Option(t+" – "+(sizes[t]/1048576).toFixed(0)+"MB",t)));
    ds.value=types.includes("q4f16")&&f16&&hasGPU?"q4f16":types.includes("q4")?"q4":types[0];
    const w=el("div","","warn");const upd=()=>{const mb=sizes[ds.value]/1048576;w.textContent=mb>700&&isIOS?"約"+mb.toFixed(0)+"MB: iPadではメモリ不足になる可能性があります(目安〜500MB)":""};ds.onchange=upd;upd();
    const go=el("button","このモデルを使う");go.style.width="100%";go.disabled=!types.length;
    const back=el("button","← 一覧に戻る","sec");back.style.cssText="width:100%;margin-top:8px";back.onclick=()=>{hd.hidden=true;hl.hidden=false};
    go.onclick=()=>{const t=ds.value,custom=!["fp32","fp16","q8","int8","uint8","q4","q4f16","bnb4"].includes(t);
      closeSheet();loadModel({id,dt:custom?"fp32":t,mf:custom?"model_"+t:null,name:id.split("/").pop()+" "+t})};
    hd.append(...(types.length?[ds,w]:[]),go,back);
  }catch(e){hd.textContent="取得に失敗しました: "+e.message}
}

// ---- 起動 ----
buildSel();updChip();renderChat();
let crashed=false;try{crashed=!!localStorage.getItem("llm_ld");localStorage.removeItem("llm_ld")}catch{}
if(crashed){S.model=null;save();updChip();const pe=$("#perr");pe.hidden=false;pe.textContent="前回の読み込み中にアプリが止まりました(メモリ不足の可能性があります)。「かんたん」など軽いモデルをお試しください。"}
else if(S.auto&&S.model&&S.model.id&&S.model.id!=="local")loadModel(S.model);
</script>
</body>
</html>
