<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ローカルAI">
<title>ローカルAI</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--sub:#6e6e73;--card:#f2f2f7;--line:#e5e5ea;--ac:#0a84ff;--ok:#30d158}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--sub:#98989d;--card:#1c1c1e;--line:#2c2c2e}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,select,textarea,input{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--fg)}button:disabled{opacity:.4}
select,textarea,input[type=text],input:not([type]){width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 12px}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
header b{font-size:17px}#chip{flex:1;min-width:0;font-size:12px;color:var(--sub);background:var(--card);border-radius:20px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#chip::before{content:"●";color:var(--sub);margin-right:6px}#chip.on::before{color:var(--ok)}
.ib{padding:6px 10px;font-size:18px;background:none;color:var(--fg)}
#setup{flex:1;overflow:auto;padding:24px 18px;max-width:640px;width:100%;margin:0 auto}
.hero{text-align:center;margin-bottom:20px}.hero .lg{font-size:56px}.hero h1{font-size:24px;margin:4px 0}.hero p{color:var(--sub);margin:6px 0}
.card{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid transparent;border-radius:16px;padding:14px 16px;margin:10px 0}
.card.rec{border-color:var(--ac)}.card b{font-size:17px}.card small{display:block;color:var(--sub);font-weight:400}
.tag{font-size:11px;background:var(--ac);color:#fff;border-radius:8px;padding:1px 8px;margin-left:8px}
.bar{height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.note{font-size:13px;color:var(--sub);text-align:center}.err{color:#ff453a;font-size:14px;margin:10px 0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:820px;margin:0 auto}
#log{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.m{max-width:88%;margin:0 0 10px;padding:9px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.u{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:6px}.a{background:var(--card);border-bottom-left-radius:6px}
.a.typing:empty::after{content:"考え中…";color:var(--sub)}.cp{display:block;font-size:12px;color:var(--sub);margin-top:4px;cursor:pointer}
#hint{text-align:center;color:var(--sub);margin-top:8vh}#hint .lg{font-size:44px}
.chip{display:inline-block;margin:4px;padding:7px 14px;border-radius:20px;background:var(--card);color:var(--fg);font-weight:500;font-size:14px}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 14px}
#inp{flex:1;resize:none;height:44px;max-height:140px;border-radius:22px;padding:10px 16px}
#send{border-radius:50%;width:44px;height:44px;padding:0;font-size:18px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--bg);width:min(720px,100%);max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph b{font-size:18px}
.body{overflow:auto;-webkit-overflow-scrolling:touch}
.body h3{font-size:13px;color:var(--sub);margin:18px 0 6px;text-transform:none}
.body label{display:flex;justify-content:space-between;font-size:14px;margin:12px 0 4px}.body label output{color:var(--sub)}
.body input[type=range]{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row button{flex:1}
.hint{font-size:12px;color:var(--sub);margin:2px 0}
#dbg{font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--card);padding:8px;border-radius:10px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#dbg .e{color:#ff453a}#dbg .w{color:#ff9f0a}
.it{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);margin:6px 0;font-weight:500;word-break:break-all}.it small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.warn{color:#ff9f0a;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<header>
  <b>ローカルAI</b><div id="chip" class="" title="設定">未読み込み</div>
  <button class="ib" id="newc" title="新しい会話">✎</button>
  <button class="ib" id="gear" title="設定">⚙️</button>
</header>

<section id="setup">
  <div class="hero"><div class="lg">🧠</div><h1>あなた専用のAI</h1>
    <p>このiPadの中だけで動くAIです。<br>会話の内容は外部に送信されません。</p></div>
  <div id="cards"></div>
  <div id="prog" hidden><div id="ptxt" style="text-align:center">準備中…</div><div class="bar"><i></i></div>
    <p class="note">初回はダウンロードに数分かかります(Wi-Fi推奨)。<br>この画面を閉じずにお待ちください。</p></div>
  <div id="perr" class="err" hidden></div>
  <p class="note" id="envnote"></p>
  <p class="note"><a href="#" id="more" style="color:var(--ac)">他のモデルを探す・ファイルから読み込む</a></p>
</section>

<section id="chat" hidden>
  <div id="log"></div>
  <form id="f"><textarea id="inp" rows="1" placeholder="メッセージを入力"></textarea><button id="send">↑</button></form>
</section>

<div id="sheet" hidden>
 <div class="pane" id="p-set" hidden>
  <div class="ph"><b>設定</b><button class="sec close">完了</button></div>
  <div class="body">
   <h3>モデル</h3>
   <div id="curm" class="hint"></div>
   <div class="row"><button class="sec" id="chg">モデルを変更</button><button class="sec" id="openHF">Hugging Faceで探す</button></div>
   <div class="row"><button class="sec" id="pickDir">📁 フォルダから</button><button class="sec" id="pickFiles">📄 ファイルから</button></div>
   <input type="file" id="dirIn" webkitdirectory multiple hidden><input type="file" id="fileIn" multiple hidden>
   <label><span><input type="checkbox" data-k="auto"> 起動時に前回のモデルを自動で読み込む</span></label>

   <h3>AIの性格・指示</h3>
   <textarea data-k="sys" rows="3"></textarea>
   <div class="hint">例:「あなたは関西弁のフレンドリーなAIです」</div>

   <h3>応答のしかた</h3>
   <label>創造性(低い=堅実 / 高い=自由)<output data-o="temp"></output></label><input type="range" data-k="temp" min="0" max="1.5" step="0.1">
   <label>最大の長さ(文字数の目安)<output data-o="maxTok"></output></label><input type="range" data-k="maxTok" min="64" max="1024" step="64">
   <label>会話の記憶(直近のやりとり数)<output data-o="mem"></output></label><input type="range" data-k="mem" min="2" max="30" step="2">
   <label>くり返しを避ける強さ<output data-o="rp"></output></label><input type="range" data-k="rp" min="1" max="1.5" step="0.05">
   <label>候補の絞り込み(top-k)<output data-o="topk"></output></label><input type="range" data-k="topk" min="1" max="100" step="1">

   <h3>表示</h3>
   <label>文字の大きさ<output data-o="fs"></output></label><input type="range" data-k="fs" min="13" max="22" step="1">

   <h3>データ</h3>
   <div id="stor" class="hint"></div>
   <div class="row"><button class="sec" id="delc">ダウンロード済みモデルを削除</button><button class="sec" id="delh">会話を全て削除</button></div>
   <div class="row"><button class="sec" id="rst">設定を初期化</button></div>

   <details style="margin-top:16px"><summary style="color:var(--sub);font-size:14px">詳細設定(上級者向け)</summary>
    <label>Transformers.js のバージョン</label>
    <select data-k="ver"><option value="4.3.0">4.3.0(推奨)</option><option value="3.7.0">3.7.0(旧)</option></select>
    <div class="hint">変更後はページの再読み込みが必要です。</div>
    <label><span><input type="checkbox" data-k="low"> 省メモリ(最適化を切る)</span></label>
    <label><span><input type="checkbox" data-k="verbose"> 詳細ログ(次回の読み込みから)</span></label>
    <div class="row"><button class="sec" id="cpl">ログをコピー</button></div>
    <div id="dbg"></div>
   </details>
  </div>
 </div>

 <div class="pane" id="p-hf" hidden>
  <div class="ph"><b>Hugging Faceから探す</b><button class="sec close">閉じる</button></div>
  <div class="row" style="flex-wrap:nowrap"><input id="hfq" placeholder="モデル名で検索 / owner/name" autocomplete="off" autocapitalize="off" style="flex:1">
   <select id="hfs" style="width:auto"><option value="downloads">人気</option><option value="trendingScore">急上昇</option><option value="createdAt">新着</option></select></div>
  <div class="body"><div id="hfl"></div><div id="hfd" hidden></div></div>
 </div>
</div>

<script type="text/plain" id="wk">
let pipeline,TextStreamer,env,stopper=null,ver=null,gen=null;
const L=(t,lv)=>postMessage({type:"log",text:t,lv:lv||"i"});
const fmt=a=>{try{return typeof a==="string"?a:(a&&a.message)||JSON.stringify(a)}catch{return String(a)}};
for(const k of["log","warn","error"]){const o=console[k].bind(console);console[k]=(...a)=>{L(a.map(fmt).join(" ").slice(0,300),k==="error"?"e":k==="warn"?"w":"i");o(...a)}}
self.addEventListener("unhandledrejection",e=>L("未処理エラー: "+fmt(e.reason),"e"));
const files={};
const prog=p=>{if(p.status==="progress"){files[p.file]={l:p.loaded,t:p.total};let l=0,t=0;for(const k in files){l+=files[k].l;t+=files[k].t}postMessage({type:"progress",pct:t?l/t*100:0,mb:l/1048576,tot:t/1048576})}else if(p.status==="done")L("取得完了 "+p.file);else if(p.status==="initiate")L("取得開始 "+p.file)};
async function init(v){
  if(ver===v)return; if(ver)throw new Error("別バージョンを使うにはページを再読み込みしてください");
  L("transformers.js "+v+" を取得中…");
  const T=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@"+v);
  pipeline=T.pipeline;TextStreamer=T.TextStreamer;env=T.env;env.allowLocalModels=false;
  stopper=T.InterruptableStoppingCriteria?new T.InterruptableStoppingCriteria():null;ver=v;L("transformers.js "+v+" 読み込み完了");
}
function local(fs){
  const map=new Map();for(const{path,file}of fs)map.set(path,file);
  env.useCustomCache=true;
  env.customCache={async match(key){
    const u=decodeURIComponent(String(key.url||key));
    const rel=u.includes("/resolve/main/")?u.split("/resolve/main/")[1]:u.split("/").pop();const base=rel.split("/").pop();
    let f=map.get(rel);if(!f)for(const[p,v]of map)if(p===base||p.endsWith("/"+rel)){f=v;break}
    return f?new Response(f,{headers:{"content-length":String(f.size)}}):undefined},async put(){}};
}
async function load(model,device,dtype,mf,opt){
  if(gen){try{await gen.dispose()}catch{}gen=null}
  const so={};
  if(opt.verbose){env.backends.onnx.logLevel="verbose";so.logSeverityLevel=0;so.logVerbosityLevel=1}
  if(opt.lowmem){so.graphOptimizationLevel="disabled";so.enableCpuMemArena=false;so.enableMemPattern=false}
  L("load "+model+" device="+device+" dtype="+dtype+(mf?" file="+mf:""));
  gen=await pipeline("text-generation",model,{device,session_options:so,dtype:mf?"fp32":dtype,...(mf?{model_file_name:mf}:{}),progress_callback:prog});
  postMessage({type:"stage",text:"最終準備中…"});
  await gen([{role:"user",content:"hi"}],{max_new_tokens:1});
}
onmessage=async({data:d})=>{
  try{
    if(d.type==="load"){
      await init(d.ver);let device=d.device,model=d.model;
      if(d.files){local(d.files);model="local/model"}
      try{await load(model,device,d.dtype,d.mf,d.opt)}
      catch(e){if(device!=="webgpu")throw e;L("WebGPU失敗→CPUに切替: "+fmt(e),"w");device="wasm";postMessage({type:"fallback"});await load(model,device,d.dtype,d.mf,d.opt)}
      postMessage({type:"ready",device});
    }else if(d.type==="generate"){
      if(stopper)stopper.reset();
      const streamer=new TextStreamer(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:"token",text:t})});
      const g=d.g;
      await gen(d.messages,{max_new_tokens:g.max,do_sample:g.temp>0,temperature:g.temp||undefined,top_k:g.topk,repetition_penalty:g.rp,streamer,...(stopper?{stopping_criteria:stopper}:{})});
      postMessage({type:"done"});
    }else if(d.type==="stop"&&stopper)stopper.interrupt();
  }catch(e){postMessage({type:"error",message:String(e&&e.message||e)})}
};
</script>

<script type="module">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DEF={sys:"あなたは親切な日本語アシスタントです。簡潔に答えてください。",temp:0.3,maxTok:512,mem:10,rp:1.05,topk:50,fs:16,ver:"4.3.0",low:false,verbose:false,auto:true,model:null};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem("llm_s")||"{}"))}catch{}
const save=()=>{try{localStorage.setItem("llm_s",JSON.stringify(S))}catch{}};
let H=[];try{H=JSON.parse(localStorage.getItem("llm_h")||"[]")}catch{}
const saveH=()=>{try{localStorage.setItem("llm_h",JSON.stringify(H.slice(-60)))}catch{}};

// ---- ログ ----
const dbg=$("#dbg"),t0=performance.now();
function log(t,lv){const d=document.createElement("div");if(lv)d.className=lv;d.textContent=((performance.now()-t0)/1000).toFixed(1)+"s "+t;dbg.append(d);while(dbg.childNodes.length>600)dbg.firstChild.remove();dbg.scrollTop=1e9}
addEventListener("error",e=>log("エラー: "+e.message,"e"));
addEventListener("unhandledrejection",e=>log("未処理: "+(e.reason&&e.reason.message||e.reason),"e"));
$("#cpl").onclick=()=>navigator.clipboard?.writeText(dbg.innerText).then(()=>log("コピーしました"),()=>{});

// ---- 環境 ----
let hasGPU=false,f16=false;
try{const a=await navigator.gpu.requestAdapter();hasGPU=!!a;f16=!!a&&a.features.has("shader-f16")}catch{}
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
log(`UA=${navigator.userAgent.slice(0,80)} WebGPU=${hasGPU} f16=${f16}`);
$("#envnote").textContent=hasGPU?"高速モードで動作します(WebGPU)":"この端末は標準モードで動作します(少し遅くなります)";

// ---- モデル候補 ----
const P=[
 {id:"onnx-community/LFM2.5-350M-ONNX",dt:f16&&hasGPU?"q4f16":"q4",name:"かんたん",desc:"軽くて速い。まずはこれ(約300MB)",rec:1},
 {id:"onnx-community/LFM2-700M-ONNX",dt:"q4",name:"ふつう",desc:"賢さと速さのバランス(約500MB)"},
 {id:"onnx-community/LFM2-1.2B-ONNX",dt:"q4",name:"高品質",desc:"より賢い。新しめのiPad・PC向け(約700MB)"},
];
function cards(){
  const c=$("#cards");c.textContent="";
  for(const m of P){const b=document.createElement("button");b.className="card"+(m.rec?" rec":"");
    b.innerHTML="<b></b><small></small>";b.firstChild.textContent=m.name+"モデル";b.lastChild.textContent=m.desc;
    if(m.rec){const t=document.createElement("span");t.className="tag";t.textContent="おすすめ";b.firstChild.append(t)}
    b.onclick=()=>loadModel(m);c.append(b)}
}
cards();

// ---- ワーカー ----
const W=new Worker(URL.createObjectURL(new Blob([$("#wk").textContent],{type:"text/javascript"})),{type:"module"});
let loading=false,ready=false,busy=false,cur=null,hb=null,last=performance.now();
const show=v=>{$("#setup").hidden=v!=="setup";$("#chat").hidden=v!=="chat"};
const bar=p=>$(".bar i").style.width=p+"%";
const modelName=()=>S.model?S.model.name:"未読み込み";
function loadModel(m){
  if(loading)return;loading=true;ready=false;
  S.model={id:m.id,dt:m.dt,mf:m.mf||null,name:m.name||m.id.split("/").pop()};if(!m.files)save();
  $("#chip").textContent=S.model.name+"(読み込み中)";$("#chip").className="";
  show("setup");$("#cards").hidden=true;$("#more").parentNode.hidden=true;$("#prog").hidden=false;$("#perr").hidden=true;bar(2);$("#ptxt").textContent="準備中…";
  last=performance.now();const ts=last;clearInterval(hb);
  hb=setInterval(()=>log(`…経過${((performance.now()-ts)/1000)|0}秒`,"t"),5000);
  log("読み込み開始: "+S.model.name+" ("+m.id+" "+m.dt+")");
  W.postMessage({type:"load",ver:S.ver,model:m.files?"local":m.id,device:hasGPU?"webgpu":"wasm",dtype:m.dt,mf:m.mf||null,files:m.files||null,opt:{verbose:S.verbose,lowmem:S.low}});
}
W.onmessage=({data:d})=>{
  last=performance.now();
  if(d.type==="log"){log(d.text,d.lv==="e"?"e":d.lv==="w"?"w":"")}
  else if(d.type==="progress"){bar(d.pct);$("#ptxt").textContent=d.pct>=99.5?"初期化中…(1〜2分かかることがあります)":`ダウンロード中 ${d.pct.toFixed(0)}%(${d.mb.toFixed(0)} / ${d.tot.toFixed(0)}MB)`}
  else if(d.type==="stage")$("#ptxt").textContent=d.text;
  else if(d.type==="fallback")$("#ptxt").textContent="標準モードに切り替えています…";
  else if(d.type==="ready"){clearInterval(hb);loading=false;ready=true;log("準備完了 "+d.device);
    $("#chip").textContent=modelName()+(d.device==="webgpu"?" ・高速":" ・標準");$("#chip").className="on";
    $("#cards").hidden=false;$("#more").parentNode.hidden=false;$("#prog").hidden=true;show("chat");renderChat();$("#inp").focus()}
  else if(d.type==="token"){cur.textContent+=d.text;$("#log").scrollTop=1e9}
  else if(d.type==="done"){H.push({role:"assistant",content:cur.textContent});saveH();endGen()}
  else if(d.type==="error"){clearInterval(hb);log("エラー: "+d.message,"e");
    if(busy){cur.textContent+=(cur.textContent?"\n":"")+"(エラーが発生しました)";endGen();return}
    loading=false;$("#cards").hidden=false;$("#more").parentNode.hidden=false;$("#prog").hidden=true;
    const pe=$("#perr");pe.hidden=false;pe.textContent="読み込めませんでした。メモリ不足の可能性があります。もっと軽いモデルをお試しください。(詳細: "+d.message+")";
    $("#chip").textContent="読み込み失敗";show("setup")}
};
W.onerror=e=>{clearInterval(hb);loading=false;log("Workerエラー: "+(e.message||"不明"),"e");$("#perr").hidden=false;$("#perr").textContent="エラーが発生しました。ページを再読み込みしてください。"};

// ---- チャット ----
function addMsg(cls,text){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;$("#log").append(d);$("#log").scrollTop=1e9;return d}
function addCopy(d){const c=document.createElement("span");c.className="cp";c.textContent="コピー";c.onclick=()=>navigator.clipboard?.writeText(d.firstChild.textContent).then(()=>{c.textContent="コピーしました"});d.append(c)}
function renderChat(){
  const l=$("#log");l.textContent="";
  if(!H.length){l.innerHTML='<div id="hint"><div class="lg">💬</div><p>なんでも聞いてみましょう</p></div>';
    for(const q of["今日の夕飯の献立を考えて","面白い雑学を教えて","メールの返信を丁寧にして"]){const c=document.createElement("button");c.className="chip";c.textContent=q;c.onclick=()=>send(q);$("#hint").append(c)}return}
  for(const m of H){const d=addMsg(m.role==="user"?"u":"a",m.content);if(m.role!=="user")addCopy(d)}
}
function endGen(){busy=false;cur.classList.remove("typing");if(cur.textContent)addCopy(cur);$("#send").textContent="↑"}
function send(t){
  t=t.trim();if(!t||!ready||busy)return;
  if(!H.length)$("#log").textContent="";
  $("#inp").value="";$("#inp").style.height="44px";
  H.push({role:"user",content:t});addMsg("u",t);cur=addMsg("a","");cur.classList.add("typing");busy=true;$("#send").textContent="■";
  W.postMessage({type:"generate",messages:[{role:"system",content:S.sys},...H.slice(-S.mem)],g:{temp:S.temp,max:S.maxTok,topk:S.topk,rp:S.rp}});
}
$("#f").onsubmit=e=>{e.preventDefault();if(busy)W.postMessage({type:"stop"});else send($("#inp").value)};
$("#inp").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$("#f").requestSubmit()}};
$("#inp").oninput=e=>{e.target.style.height="44px";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"};
$("#newc").onclick=()=>{if(busy)return;H=[];saveH();if(ready)renderChat()};

// ---- 設定シート ----
const pane=id=>{$("#sheet").hidden=false;$$(".pane").forEach(p=>p.hidden=p.id!==id)};
const closeSheet=()=>$("#sheet").hidden=true;
$$(".close").forEach(b=>b.onclick=closeSheet);
$("#sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
async function stor(){try{const e=await navigator.storage.estimate();$("#stor").textContent="この端末に保存中のデータ: 約"+((e.usage||0)/1048576).toFixed(0)+"MB"}catch{$("#stor").textContent=""}}
function openSet(){$("#curm").textContent="現在のモデル: "+modelName();pane("p-set");stor()}
$("#gear").onclick=openSet;$("#chip").onclick=openSet;
$("#chg").onclick=()=>{closeSheet();if(!loading){ready=false;show("setup");$("#perr").hidden=true}};
$("#more").onclick=e=>{e.preventDefault();openSet()};
const applyFs=()=>document.body.style.fontSize=S.fs+"px";
$$("[data-k]").forEach(el=>{
  const k=el.dataset.k,cb=el.type==="checkbox",o=$(`[data-o=${k}]`);
  const put=()=>{if(cb)el.checked=!!S[k];else el.value=S[k];if(o)o.textContent=S[k]};put();
  el.oninput=el.onchange=()=>{S[k]=cb?el.checked:(el.type==="range"?+el.value:el.value);if(o)o.textContent=S[k];save();applyFs()};
});
applyFs();
$("#delc").onclick=async()=>{if(!confirm("ダウンロード済みのモデルをすべて削除します。次回は再ダウンロードが必要です。"))return;try{for(const k of await caches.keys())await caches.delete(k)}catch{}stor()};
$("#delh").onclick=()=>{if(!confirm("会話をすべて削除します。"))return;H=[];saveH();if(ready)renderChat()};
$("#rst").onclick=()=>{if(!confirm("設定を初期化します。"))return;try{localStorage.removeItem("llm_s")}catch{}location.reload()};

// ---- ローカルファイル ----
const DT={quantized:"q8"};
$("#pickDir").onclick=()=>$("#dirIn").click();$("#pickFiles").onclick=()=>$("#fileIn").click();
function onPick(e){
  const fs=[...e.target.files];if(!fs.length)return;
  const L2=fs.map(f=>({path:f.webkitRelativePath?f.webkitRelativePath.split("/").slice(1).join("/"):f.name,file:f}));
  const types=new Set();
  for(const{path}of L2){const m=path.split("/").pop().match(/^model(?:_(.+))?\.onnx$/);if(m)types.add(DT[m[1]]||m[1]||"fp32")}
  if(!types.size){alert("model*.onnx が見つかりません。onnxフォルダごと選んでください。");return}
  const t=f16&&types.has("q4f16")?"q4f16":types.has("q4")?"q4":[...types][0];
  const known=["fp32","fp16","q8","int8","uint8","q4","q4f16","bnb4"].includes(t);
  closeSheet();loadModel({id:"local",files:L2,dt:known?t:"fp32",mf:known?null:"model_"+t,name:"ローカルモデル("+t+")"});e.target.value="";
}
$("#dirIn").onchange=$("#fileIn").onchange=onPick;

// ---- Hugging Faceブラウザ ----
const hq=$("#hfq"),hl=$("#hfl"),hd=$("#hfd");
const el=(t,x,c)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e};
$("#openHF").onclick=()=>{pane("p-hf");hq.focus();if(!hl.childElementCount)hfSearch()};
let hT;hq.oninput=()=>{clearTimeout(hT);hT=setTimeout(hfSearch,450)};
hq.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=hq.value.trim();/^[\w.-]+\/[\w.-]+$/.test(v)?hfDetail(v):hfSearch()}};
$("#hfs").onchange=hfSearch;
async function hfSearch(){
  hd.hidden=true;hl.hidden=false;hl.textContent="検索中…";const q=hq.value.trim();
  try{
    const r=await fetch("https://huggingface.co/api/models?"+(q?"search="+encodeURIComponent(q)+"&":"")+"filter=onnx&pipeline_tag=text-generation&sort="+$("#hfs").value+"&direction=-1&limit=30");
    if(!r.ok)throw new Error("HTTP "+r.status);const a=await r.json();hl.textContent="";
    if(!a.length){hl.textContent="見つかりませんでした";return}
    for(const m of a){const b=el("button",m.id,"it");if((m.tags||[]).includes("transformers.js")){const t=el("span","対応",null);t.className="tag";b.append(t)}
      b.append(el("small","↓"+(m.downloads||0).toLocaleString()+"  ♥"+(m.likes||0)));b.onclick=()=>hfDetail(m.id);hl.append(b)}
  }catch(e){hl.textContent="検索に失敗しました: "+e.message}
}
async function hfDetail(id){
  hl.hidden=true;hd.hidden=false;hd.textContent="情報を取得中…";
  try{
    const r=await fetch("https://huggingface.co/api/models/"+id+"?blobs=true");if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json(),sizes={},names=new Set();
    for(const f of j.siblings||[]){names.add(f.rfilename.split("/").pop());
      const m=f.rfilename.match(/^onnx\/model(?:_([A-Za-z0-9]+))?\.onnx(?:_data(?:_\d+)?)?$/);
      if(m){const t=DT[m[1]]||m[1]||"fp32";sizes[t]=(sizes[t]||0)+(f.size||(f.lfs&&f.lfs.size)||0)}}
    hd.textContent="";hd.append(el("b",id));
    const types=Object.keys(sizes).sort((a,b)=>sizes[a]-sizes[b]);
    if(!types.length)hd.append(el("div","ブラウザ用のONNXファイルが見つかりません。","warn"));
    const miss=["config.json","tokenizer.json"].filter(n=>!names.has(n));
    if(miss.length)hd.append(el("div","注意: "+miss.join(", ")+" がないため動かない可能性があります。","warn"));
    const ds=document.createElement("select");ds.style.margin="8px 0";
    types.forEach(t=>ds.add(new Option(t+" – "+(sizes[t]/1048576).toFixed(0)+"MB",t)));
    ds.value=types.includes("q4f16")&&f16&&hasGPU?"q4f16":types.includes("q4")?"q4":types[0];
    const w=el("div","","warn");const upd=()=>{const mb=sizes[ds.value]/1048576;w.textContent=mb>700&&isIOS?"約"+mb.toFixed(0)+"MB: iPadではメモリ不足になる可能性があります(目安〜500MB)":""};ds.onchange=upd;upd();
    const go=el("button","このモデルを使う");go.style.width="100%";go.disabled=!types.length;
    const back=el("button","← 一覧に戻る","sec");back.style.cssText="width:100%;margin-top:8px";back.onclick=()=>{hd.hidden=true;hl.hidden=false};
    go.onclick=()=>{const t=ds.value,custom=!["fp32","fp16","q8","int8","uint8","q4","q4f16","bnb4"].includes(t);
      closeSheet();loadModel({id,dt:custom?"fp32":t,mf:custom?"model_"+t:null,name:id.split("/").pop()+" "+t})};
    hd.append(...(types.length?[ds,w]:[]),go,back);
  }catch(e){hd.textContent="取得に失敗しました: "+e.message}
}

// ---- 起動 ----
$("#chip").textContent=modelName();
if(S.auto&&S.model&&S.model.id&&S.model.id!=="local")loadModel(S.model);
</script>
</body>
</html>
